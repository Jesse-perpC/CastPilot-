name: Fast Lint & Tests (PR Gate)

on:
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Fast Lint & Compilation Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run TypeScript Linter
        run: npm run lint

      - name: Verify Web Production Build
        run: npm run build:client
