name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-project:
    name: 1. Build & Verify Project
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Lint & Verification
        run: npm run lint

      - name: Build Web Bundle
        run: npm run build:client

      - name: Package Web Distribution ZIP
        run: |
          cd dist
          zip -r ../castpilot-web-build-${{ github.ref_name }}.zip .
          cd ..

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: castpilot-web-build-*.zip

  build-desktop:
    name: 2. Build Desktop (${{ matrix.os }})
    needs: build-project
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Packagers
        run: |
          npm install
          npm install --save-dev electron@^30.0.0 electron-builder@^24.13.3

      - name: Install Linux FUSE & Packaging Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libarchive-tools

      - name: Build Web Assets
        run: npm run build:client

      # macOS Build: produces .dmg and .zip
      - name: Package macOS Application (.dmg, .zip)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Windows Build: produces .exe
      - name: Package Windows Application (.exe)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      # Linux Build: produces .AppImage and .zip
      - name: Package Linux Application (.AppImage, .zip)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
          if-no-files-found: warn

  build-android:
    name: 3. Build Mobile Android (.apk)
    needs: build-project
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install --save-dev @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Build Web Assets
        run: npm run build:client

      - name: Synchronize Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Android APK
        run: |
          mkdir -p android-dist
          cp android/app/build/outputs/apk/debug/app-debug.apk android-dist/castpilot-live-studio-${{ github.ref_name }}.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-dist/*.apk
          if-no-files-found: warn

  create-release:
    name: 4. Create GitHub Release
    needs: [build-project, build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts

      - name: Collect All Release Binaries
        run: |
          mkdir -p release-assets
          find all-artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" -o -name "*.apk" \) -exec cp {} release-assets/ \;
          echo "=== Collected Release Binaries ==="
          ls -lh release-assets/

      - name: Create GitHub Release with Attached Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
