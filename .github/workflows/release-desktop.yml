name: Build Desktop (Mac, Windows, Linux) & Mobile (Android)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual App Build'

permissions:
  contents: write

jobs:
  lint-and-verify:
    name: 1. Fast Lint & Types Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: TypeScript Lint & Typecheck
        run: npm run lint

      - name: Build Web Production Bundle
        run: npm run build:client

  build-desktop:
    name: 2. Build Desktop (${{ matrix.os }})
    needs: lint-and-verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install
          npm install --save-dev electron@^30.0.0 electron-builder@^24.13.3

      - name: Build Production Web Assets
        run: npm run build:client

      # macOS Build: produces .dmg and .zip
      - name: Package macOS App (.dmg, .zip)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # Windows Build: produces .exe
      - name: Package Windows App (.exe)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      # Linux Build: produces .AppImage and .deb
      - name: Package Linux App (.AppImage, .deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      # Upload downloadable build artifacts on EVERY commit to the Actions tab
      - name: Upload Desktop Artifacts (Downloadable in Actions)
        uses: actions/upload-artifact@v4
        with:
          name: CastPilot-Desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

      # If triggered by a version tag (v*), publish to GitHub Releases
      - name: Attach to GitHub Release (Release Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: 3. Build Android App (.apk)
    needs: lint-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies & Capacitor
        run: |
          npm install
          npm install --save-dev @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Build Production Web Assets
        run: npm run build:client

      - name: Add & Synchronize Android Platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Compile Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # Upload Android APK as a downloadable artifact on EVERY commit
      - name: Upload Android APK (Downloadable in Actions)
        uses: actions/upload-artifact@v4
        with:
          name: CastPilot-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # If triggered by a version tag (v*), attach the APK to GitHub Releases
      - name: Attach Android APK to GitHub Release (Release Tags only)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        with:
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
