name: Build & Release Desktop & Mobile Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version Tag (e.g. v1.0.0)'
        required: false
        default: 'manual-test'

permissions:
  contents: write

jobs:
  lint-and-verify:
    name: Pre-Flight Gatekeeper (Linter & Types)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: TypeScript Lint & Typecheck
        run: npm run lint

      - name: Build Web Bundle
        run: npm run build:client

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: lint-and-verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install electron & electron-builder
        run: npm install --save-dev electron electron-builder

      - name: Build Production Client SPA
        run: npm run build:client

      # macOS Build: produces .dmg and .zip
      - name: Package macOS App (.dmg, .zip)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false # Disables signing error for unsigned local distribution

      # Windows Build: produces .exe
      - name: Package Windows App (.exe)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --publish never

      # Linux Build: produces .AppImage
      - name: Package Linux App (.AppImage, .deb)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --publish never

      - name: Upload Binary Artifacts to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
